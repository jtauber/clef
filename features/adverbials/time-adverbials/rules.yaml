rules:
  - id: biber
    from: biber_1988
    at: Appendix II, section B, no. 5, p. 224
    match:
      - cql: |
          [form=$biber_1988/time-adverbials%c]
    note: |
      Reconstructs Biber's printed list as case-insensitive whole-word
      matches. The entry specifies no POS or contextual condition, so this
      rule adds none. Behaviour of the original tagging program has not
      been verified.

      The rule misses unlisted time adverbials such as *already* and *then*.
      It also matches listed forms used as adjectives (*the early train*),
      nouns (*tomorrow is a holiday*), subordinators (*once you arrive*)
      or discourse markers without a temporal meaning.

  - id: mat
    from: mat
    at: Tagger_MAT.pl, tags time adverbials; tags discourse particles
    match:
      - cql: |
          [form=".*\b${mat/time-adverbials}(_.*)?"%c]
    unless:
      - cql: |
          @[form=".*\bsoon(_.*)?"%c & form!=".*\b(?!soon(?:_|$))${mat/time-adverbials}(_.*)?"%c] [form=".*\bas(_.*)?"%c]
      - cql: |
          [xpos="\W.*"] @[form=".*\bnow(_.*)?"%c]
    note: |
      MAT 1.3.2 uses Biber's 28 forms plus *to-day*, *to-morrow* and
      *to-night*, ignoring case and without requiring an adverb tag.
      MAT combines each word and its tag into a word_TAG string, then
      searches for a listed form at a word boundary followed by an
      underscore. For example, it finds *now_* in *right-now_RB*.
      CLEF keeps form and xpos separate, so the CQL pattern matches
      *now* at the end of the form *right-now*.

      MAT can also find *now_* in *now_extra_RB*, where that underscore
      is part of the supplied form *now_extra*. The optional `(_.*)?`
      reproduces this case by matching the literal suffix *_extra* in
      form. It does not match MAT's separator or the POS tag, and is
      unused for *right-now*.
      A matched token supplies one anchor, even with multiple matches.

      It excludes *soon* immediately followed by *as*, regardless of the
      preceding word or either token's POS tag. Its later discourse-
      particle pass replaces TIME on *now* after a token whose tag begins
      with a non-word character, including ordinary Penn punctuation
      tags. The second exclusion reconstructs that pass using the
      supplied tag. It can exclude genuinely temporal *now* after a comma.
      Both exclusions use MAT's word-boundary matching: *very-soon* before
      *such-as* is excluded, and *right-now* after punctuation is excluded.
      The *soon* exclusion preserves a detection from another listed
      form in the same token, which MAT's earlier time-adverbial check
      can already have tagged TIME.

      Patterns stay within the supplied sentence. They do not reproduce
      MAT's use of the preceding sentence's punctuation, or its Perl
      array behaviour at the beginning of an input: the previous-token
      lookup there reads the last token. For example, sentence-initial
      *Now* is left counted here, but MAT retags it DPAR when the input
      ends in punctuation.

      MAT's tagger, text preprocessing and other earlier retagging are
      not fully reproduced.
      As with Biber's rule, unlisted *already* and *then* are missed, while
      listed words can count in nominal, adjectival or clause-introducing
      uses.

  - id: pybiber
    from: pybiber
    at: biber_dict.py, FEATURES f_05_time_adverbials; parse_functions.py, _block_regex_features
    tagsets: {deprel: clearnlp}
    match:
      - cql: |
          [deprel!="punct"
           & form=".*\b${pybiber/time-adverbials}"%c & xpos="R.*"%c]
    note: |
      pybiber 0.3.1 accepts 29 forms with a tag beginning R. Its list omits
      Biber's *afterwards* and *soon*, and adds *to-day*, *to-morrow* and
      *to-night*. It requires one token for each listed spelling, so a
      hyphenated form split into several tokens is not recovered.
      Standard Penn matches include RB, RBR, RBS and RP; WRB does not match.
      The prefix test also preserves nonstandard continuations such as RBX.

      There is no lemma or temporal-function test. Nominal and adjectival
      uses normally fail the tag condition, but mistags and non-temporal
      uses with a qualifying tag can count. *Already* and *then* are absent.
      Unlike MAT, pybiber does not exclude *now* after punctuation. *Soon*
      is absent from the inventory altogether, not conditionally excluded
      before *as*.

      The source first discards tokens whose form is a single space and
      tokens tagged `_SP`. It replaces tokens whose dependency relation
      is exactly `punct`, then lowercases and concatenates forms and tags
      as `word_tag` strings. Its regex starts
      at a word boundary before a listed form, so a hyphenated prefix can
      match: *right-now* supplies *now*, but *rightnow* does not.
      The reconstruction declares spaCy's ClearNLP-derived relations for
      the punctuation test; it does not use a dependency-tree pattern.

      This reconstruction tests form and xpos separately. It deliberately
      omits the source's matches on apparent tags embedded in a form.
      For example, *today_rb* tagged NN becomes *today_rb_nn* in pybiber and
      counts as a time adverbial; CLEF does not count it. This is a known
      reconstruction difference on an unusual supplied form, even if its
      actual tag begins R. The underscore is part of the supplied form.

      The pattern respects punctuation replacement. The R-prefix test
      already excludes `_SP`.
      Matching ignores case for the lexical and tag-prefix tests, as the
      source's lowercasing does for ordinary English forms and tags.

      Each matching token supplies one anchor. Pybiber returns document
      counts, not anchors. Multiple regex matches inside a whitespace-
      containing form, matches buried in malformed tag strings and unusual
      Unicode lowercasing are not fully reproduced. The source's spaCy
      parsing and frequency normalization are outside this reconstruction.
