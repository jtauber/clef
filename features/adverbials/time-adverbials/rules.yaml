rules:
  - id: biber
    from: biber_1988
    at: Appendix II, section B, no. 5, p. 224
    match:
      - cql: |
          [form=$biber_1988/time-adverbials%c]
    note: |
      Reconstructs Biber's printed list as case-insensitive whole-word
      matches. The entry specifies no POS or contextual condition, so this
      rule adds none. Behaviour of the original tagging program has not
      been verified.

      The rule misses unlisted time adverbials such as *already* and *then*.
      It also matches listed forms used as adjectives (*the early train*),
      nouns (*tomorrow is a holiday*), subordinators (*once you arrive*)
      or discourse markers without a temporal meaning.

  - id: mat
    from: mat
    at: Tagger_MAT.pl, tags time adverbials; tags discourse particles
    match:
      - cql: |
          [form=$mat/time-adverbials%c]
    unless:
      - cql: |
          @[form="soon"%c] [form="as"%c]
      - cql: |
          [xpos="\W.*"] @[form="now"%c]
    note: |
      MAT 1.3.2 uses Biber's 28 forms plus *to-day*, *to-morrow* and
      *to-night*, ignoring case and without requiring an adverb tag.
      Hyphenated forms match only when supplied as one token.

      It excludes *soon* immediately followed by *as*, regardless of the
      preceding word or either token's POS tag. Its later discourse-
      particle pass replaces TIME on *now* after a token whose tag begins
      with a non-word character, including ordinary Penn punctuation
      tags. The second exclusion reconstructs that pass using the
      supplied tag. It can exclude genuinely temporal *now* after a comma.

      Patterns stay within the supplied sentence. They do not reproduce
      MAT's use of the preceding sentence's punctuation, or its Perl
      array behaviour at the beginning of an input: the previous-token
      lookup there reads the last token. For example, sentence-initial
      *Now* is left counted here, but MAT retags it DPAR when the input
      ends in punctuation.

      Whole-token matching also omits MAT's word-boundary substring
      matches inside word_TAG strings, such as *right-now* supplied as
      one token. MAT's tagger and text preprocessing are not reproduced.
      As with Biber's rule, unlisted *already* and *then* are missed, while
      listed words can count in nominal, adjectival or clause-introducing
      uses.
