  - id: biber
    from: biber_1988
    at: Appendix II, section D, no. 13, p. 227; notation on pp. 222–223
    match:
      - cql: |
          (<s> | [form="[.!?:;-]"])
          @[form="what|where|when|how|whether|why|whoever|whomever|whichever|wherever|whenever|whatever|however"%c]
          [form="can|may|shall|will|could|might|should|would|must|do|does|did|doing|done|have|has|had|having|am|is|are|was|were|being|been"%c]
    unless:
      - cql: |
          @[form="what|where|when|how|whether|why|whoever|whomever|whichever|wherever|whenever|whatever|however"%c]
          []
          [form="n['’]t"%c]
    note: |
      Approximates (CL-P or T#) + WHO + AUX with sentence start or clause
      punctuation, anchoring on WHO. The grammatical inventories are
      matched by whole form, ignoring case, without a POS
      test. The WHO list includes *whether* and the -ever forms, but not
      *who*, *whom*, *whose* or *which*. AUX expands the printed MODAL, DO,
      HAVE and BE inventories with all contracted forms removed. Non-finite
      entries remain; bare *be* is absent from the printed BE list.

      Fused negative contractions fail the AUX list. The exclusion also
      rejects an auxiliary followed by a separate *n't* or *n’t* token,
      preserving the contraction restriction across that common split.
      Other tokenizations are not normalized. An uncontracted *not* is
      allowed after AUX. No final question mark or question analysis is
      required, so matching non-question sequences can overcount.

      CL-P is the six literal punctuation forms . ! ? : ; -; commas,
      quotation marks and typographic dashes are not added. Sentence start
      is a proxy for unavailable boundary information, not a tone-unit
      annotation. It also allows a question after sentence-ending punctuation
      that is no longer available in the current supplied sentence. Internal
      tone-unit boundaries without qualifying punctuation remain unavailable.
      WHO must immediately follow the boundary and AUX must immediately
      follow WHO. The original tagging program and its input have not been
      reproduced or verified.

  - id: mat
    from: mat
    at: Tagger_MAT.pl, SHORTCUTS; basic tags needed for complex tags; tags WH questions (lines 265–272)
    match:
      # The ordinary branch tags WHO after punctuation and before an auxiliary.
      - cql: |
          [xpos="\W.*" & form!=".*,.*" & xpos!=".*,.*"]
          @[
            form=".*(\bwhat|where|when|how|whether|why|whoever|whomever|whichever|wherever|whenever|whatever|however)(_.*)?"%c
            & form!=".*\b(however|whatever)(_.*)?"%c
            & xpos="\w.*"
          ]
          [
            (xpos="MD.*" & form!=".*\b(${mat/prepositions}|${mat/quantifiers}|${mat/indefinite-pronouns})(_.*)?"%c)
            | form=".*\b(do|does|did|doing|done|have|has|'ve|had|having|hath|be|am|is|are|was|were|been|being|m|re)(_.*)?"%c
            | (form=".*\bs(_.*)?"%c & xpos="VBZ.*"%c)
          ]
      # MAT's extra BE branch tags the intervening token, not the WH-word.
      - cql: |
          [xpos="\W.*" & form!=".*,.*" & xpos!=".*,.*"]
          @[xpos="\w.*"]
          [
            form=".*(\bwhat|where|when|how|whether|why|whoever|whomever|whichever|wherever|whenever|whatever|however)(_.*)?"%c
            & form!=".*\b(however|whatever)(_.*)?"%c
          ]
          [
            form=".*\b(be|am|is|are|was|were|been|being|m|re)(_.*)?"%c
            | (form=".*\bs(_.*)?"%c & xpos="VBZ.*"%c)
          ]
    note: |
      MAT 1.3.2 requires a punctuation tag followed by a WHO form and
      a modal or listed DO/HAVE/BE form. Punctuation means a tag beginning
      with a non-word character; a comma anywhere in that token's form or
      tag disqualifies it. Quotes, brackets and dashes can therefore qualify.
      Sentence start alone does not. No final question mark is required.

      The source excludes HOWEVER and WHATEVER. Its WHO expression is
      ungrouped after the initial word-boundary assertion, so only WHAT
      requires that boundary. The other alternatives can match word endings:
      *somewhere* can satisfy WHERE. The patterns preserve this behaviour
      and the separate word-boundary exclusion for HOWEVER/WHATEVER.

      DO/HAVE/BE use case-insensitive word-boundary matching, including an
      optional underscore suffix in a supplied form. Bare *be* and *hath*
      qualify. BE accepts *'m*, *'re* and *'s*, with either apostrophe style;
      *'s* requires a VBZ-prefixed tag. The boundary before HAVE's *'ve*
      cannot match a standalone apostrophe-initial token, although it can
      match inside a fused form such as *we've*. A following split *n't*
      does not block the rule. Fused negatives are not normalized.

      The modal branch uses an MD-prefixed tag. Basic lexical retagging
      removes MAT's prepositions, quantifiers and indefinite pronouns from
      that branch; the explicit exceptions account for those passes.
      Other contextual retagging and unusual embedded tag strings are not
      fully reconstructed. No WH POS test is required, but the token being
      tagged must have a tag beginning with a word character for MAT's
      substitution to succeed.

      A separate source branch allows one token between punctuation and
      WHO, followed specifically by BE. It nevertheless adds WHQU to that
      intervening token. The second pattern preserves that anchor: in
      *: exactly where is the exit?*, it detects *exactly*, not *where*.
      That is a false positive and a missed question under CLEF's marking.

      The source's input can contain several sentences. CLEF patterns stay
      within a supplied sentence, so preceding sentence-final punctuation
      outside that sentence cannot supply the required context. MAT's
      Stanford tagger, raw-text correction and full sequence of intermediate
      tags are not reproduced. The linguistic examples remain independent
      of MAT's detection quirks.
