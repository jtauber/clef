rules:
  - id: biber
    from: biber_1988
    at: Appendix II, section C1, no. 6, p. 225
    match:
      - cql: |
          [form="i|me|we|us|my|our|myself|ourselves"%c]
      - cql: |
          [form="i['’](m|ve|(ll|d)(['’]ve)?)|we['’](re|ve|(ll|d)(['’]ve)?)"%c]
      - cql: |
          [form="let['’]s"%c]
      - cql: |
          [form="let"%c] @[form="['’]s"%c]
    note: |
      The base pattern preserves the printed inventory. It misses *mine*
      and *ours*.

      Contractions are reconstructed as I/WE plus an auxiliary, including
      *I'd've*, and US in *let's*. Both straight and curly apostrophes are
      accepted. A separated pronoun matches the base pattern; fused forms
      match as one token. With *let* followed by *'s*, the anchor is *'s*.
      Other contracted spellings and tokenizations can be missed.

      Matching ignores case and POS, so *US* as an abbreviation, *I* as a
      numeral and mentions of these forms also match. The original tagging
      program's behaviour has not been verified.

  - id: mat
    from: mat
    at: Tagger_MAT.pl, tags first person pronouns
    match:
      - cql: |
          [form=".*\b(i|me|we|us|my|our|myself|ourselves)(_.*)?"%c & xpos="\w.*"]
    note: |
      Uses MAT's eight forms without requiring a pronoun tag. Independent
      possessives *mine* and *ours* are absent. Split I/WE contractions
      match on the pronoun; fused contractions and contracted US in
      *let's* are not expanded by this tagging pass.

      MAT 1.3.2 searches case-insensitively for a listed form at a word
      boundary followed by an underscore in its word_TAG string. The
      pattern preserves matches such as *not-me*, and accepts an
      underscore suffix in the supplied form. The xpos condition only
      requires a tag that MAT can replace; it is not a grammatical filter.
      Homographs and word mentions can therefore count.

      MAT's tagger and raw-text preprocessing are not reproduced. Earlier
      retagging and interactions between several listed forms inside one
      supplied token are not fully represented. Each token has one anchor.
