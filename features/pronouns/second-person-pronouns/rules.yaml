rules:
  - id: biber
    from: biber_1988
    at: Appendix II, section C1, no. 7, p. 225
    match:
      - cql: |
          [form="you|your|yourself|yourselves"%c]
      - cql: |
          [form="you['’](re|ve|(ll|d)(['’]ve)?)"%c]
    note: |
      The base pattern preserves the printed inventory. It misses *yours*.

      Contractions are reconstructed as YOU plus an auxiliary, including
      *you'd've*. Both straight and curly apostrophes are accepted. A
      separated pronoun matches the base pattern; fused forms match as one
      token. Other contracted spellings and tokenizations can be missed.

      Matching ignores case and POS, so mentions of these word forms also
      match. The original tagging program's behaviour has not been verified.

  - id: mat
    from: mat
    at: Tagger_MAT.pl, tags second person pronouns
    match:
      - cql: |
          [form=".*\b(you|your|yourself|yourselves|thy|thee|thyself|thou)(_.*)?"%c & xpos="\w.*"]
    note: |
      Uses MAT's eight forms, including *thou*, *thy*, *thee* and *thyself*,
      without requiring a pronoun tag. *Yours* and *thine* are absent.
      Split YOU contractions match on the pronoun; fused contractions
      are not expanded by this tagging pass.

      MAT 1.3.2 searches case-insensitively for a listed form at a word
      boundary followed by an underscore in its word_TAG string. The
      pattern preserves matches such as *not-me*, and accepts an
      underscore suffix in the supplied form. The xpos condition only
      requires a tag that MAT can replace; it is not a grammatical filter.
      Homographs and word mentions can therefore count.

      MAT's tagger and raw-text preprocessing are not reproduced. Earlier
      retagging and interactions between several listed forms inside one
      supplied token are not fully represented. Each token has one anchor.
