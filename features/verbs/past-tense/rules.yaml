rules:
  - id: xpos
    match:
      - cql: |
          [xpos="VBD"]
    note: |
      Taggers give *had* in *had better* VBD, so this rule counts it against
      the conventions. Contracted *'d* is only as good as the tagger's choice
      between HAD (VBD) and WOULD (MD).

  - id: ud-feats
    match:
      - cql: |
          [upos="VERB|AUX" & feats.Tense="Past" & feats.VerbForm="Fin"]
    note: |
      The same feature stated with UD morphological features instead of a
      Penn tag, for pipelines that emit `feats` but no reliable `xpos`.

  - id: contextual
    match:
      - cql: |
          [xpos="VBD"]
      - use: contracted-perfect-had/contextual
    unless:
      - use: perfect-aspect/contextual
      - use: be-passives/contextual
      - use: get-passives/contextual
      - use: have-got/contextual
      - use: have-need-to/contextual
    note: |
      A CLEF proposal inspired by MFTE's category distinctions and
      corrections of mistagged participles [@mfte]. It counts supplied
      VBD tokens and recovered contracted HAD, excluding anchors found
      by the referenced feature rules. Each rule states its own
      criteria and limitations alongside its feature definition.

      This rule interprets the method rather than reconstructing MFTE's
      implementation. It keeps supplied POS tags available throughout:
      *he* is not temporarily made a filled pause, pronouns are not
      restricted by spelling or capitalization, and HAVE got cannot
      prevent the following participle from being a GET-passive.
      Coordination is recognised for perfects and both passive types.
      Ambiguous *'s* uses MFTE's preferred perfect forms and stative list.

      The context windows remain heuristics, with possible clause-boundary
      errors and adjectival/passive ambiguity. The GET-passive rule can mistake
      a following finite verb for a participle. Necessity-modal HAVE/NEED
      + *to* is excluded following MFTE, although CLEF's conventions count
      finite *had* and *needed*. Supplied VBD in *had better* still counts;
      modal-tagged *'d better* is not added as a past-tense candidate.

      The separate mfte rule remains the implementation reconstruction
      used for source-fidelity comparisons. Differences from that rule
      are expected and do not establish that this proposal is more accurate.

  - id: mat
    from: mat
    at: Tagger_MAT.pl, tags quantifiers; tags emphatics
    match:
      - cql: |
          [xpos="VBD"]
    unless:
      - cql: |
          [form=$mat/quantifiers%c]
      - cql: |
          [form=$mat/emphatics%c]
      - cql: |
          @[form="do|does|did|doing|done"%c] [xpos="V.*" & form!=$mat/quantifiers%c]
    note: |
      MAT 1.3.2 counts tokens that retain VBD after its retagging passes.
      It retags DO directly followed by a verb as an emphatic
      (Tagger_MAT.pl, emphatics). Its perfect and passive rules tag HAVE
      and BE and leave the participle alone, so a participle mistagged VBD
      after them still counts.
      Its DO list includes *do*, *does*, *did*, *doing* and *done*, regardless
      of the supplied tag; any of these mistagged VBD is excluded before a verb.

      MAT replaces the tags of its nine quantifier forms with QUAN and
      its four unconditional emphatic forms with EMPH, regardless of their
      supplied POS tags. The lexicon exclusions reproduce this for
      whole-token forms, ignoring case, so *all* or *really* mistagged VBD
      does not count.

      Quantifiers are retagged across the input before the DO check, so a
      following quantifier cannot supply its verb context. Emphatics are
      retagged from left to right: a following *really* still supplies that
      context if its input tag begins V. Other lexical and contextual
      retagging remains only partly represented.

  - id: mfte
    from: mfte
    at: MFTE.py, lines 394-420, 651-664, 806-822, 898-924, 1121-1123, 1186-1187
    match:
      # Start with tokens supplied as past tense.
      - cql: |
          [xpos="VBD"]

      # Recover HAD from modal-tagged 'd before a participle.
      # Exclude negators and he, whose tags MFTE changes earlier.
      - cql: |
          @[form="'d"%c & xpos="MD"]
          [xpos="RB.*" & form!="not|n['’]t|nt|he"%c]{0,1}
          [xpos="VBN"]

      # MFTE also changes modal-tagged 'd to HAD before better.
      - cql: |
          @[form="'d"%c & xpos="MD"]
          [form="better"%c]

    # Remove candidates that MFTE retags. Each clause removes only its
    # @ anchor; the surrounding tokens supply context.
    unless:
      # BE-passive: remove an -ed/-en participle supplied as VBD.
      # Temporarily retagged he cannot supply an intervening POS tag.
      - cql: |
          [
            (form="be|am|is|are|was|were|been|being|['’]m|['’]re"%c & xpos="V.*")
            | (form="['’]s" & xpos="VBZ")
          ]
          [xpos="RB.*|CC|NN.*|PRP" & form!="he"%c]{0,2}
          @[form=".*(ed|en)"%c & xpos="VBD"]

      # HAVE/NEED before infinitival to become necessity modals.
      - cql: |
          @[form="need|needs|needed|have|has|had|having"%c & xpos="V.*"]
          [form="to" & xpos="TO"]

      # Continue a BE-passive through and/or coordination.
      # The repeated group allows earlier coordinated participles before
      # the VBD anchor; the first participle may be VBN or VBD.
      - cql: |
          [form="be|am|is|are|was|were|been|being|['’]m|['’]re"%c & xpos="V.*"]
          [xpos="RB.*|CC|NN.*|PRP" & form!="he"%c]{0,2}
          [xpos="VBN" | (form=".*(ed|en)"%c & xpos="VBD")]
          (
            [form="and|or"%c]
            [xpos="VBN" | (form=".*(ed|en)"%c & xpos="VBD")]
          )*
          [form="and|or"%c]
          @[form=".*(ed|en)"%c & xpos="VBD"]

      # After 's, with at most one adverb, a coordinated passive requires
      # a first participle that MFTE does not reclaim as a perfect.
      - cql: |
          [form="['’]s" & xpos="VBZ"]
          [xpos="RB.*" & form!="he"%c]{0,1}
          [
            (xpos="VBN" | (form=".*(ed|en)"%c & xpos="VBD"))
            & form!="been|had|done"%c
            & form!=$mfte/stative-verbs%c
          ]
          (
            [form="and|or"%c]
            [xpos="VBN" | (form=".*(ed|en)"%c & xpos="VBD")]
          )*
          [form="and|or"%c]
          @[form=".*(ed|en)"%c & xpos="VBD"]

      # After 's plus a coordinator, noun or pronoun, that perfect
      # override does not apply. Continue the passive coordination.
      - cql: |
          [form="['’]s" & xpos="VBZ"]
          [xpos="CC|NN.*|PRP" & form!="he"%c]
          [xpos="VBN" | (form=".*(ed|en)"%c & xpos="VBD")]
          (
            [form="and|or"%c]
            [xpos="VBN" | (form=".*(ed|en)"%c & xpos="VBD")]
          )*
          [form="and|or"%c]
          @[form=".*(ed|en)"%c & xpos="VBD"]

      # HAVE-perfect: remove an -ed participle supplied as VBD.
      # Lower-case he can qualify by spelling in a one-token gap, but
      # cannot supply the first POS tag in a two-token gap.
      - cql: |
          [
            (form="have|has|['’]ve|had|having|['’]d"%c & xpos="V.*")
            | (form="['’]s" & xpos="VBZ")
            | form="hath"%c
          ]
          (
            [(xpos="RB.*|CC|NN.*|PRP" & form!="he"%c) | form="he"]{0,1}
            | [xpos="RB.*|CC|NN.*|PRP" & form!="he"%c]
              [xpos="RB.*|CC|NN.*|PRP"]
          )
          @[form=".*ed"%c & xpos="VBD"]

      # GET-passive: remove the following VBD token.
      # The lookbehind on got preserves the HAVE + two-adverb exception:
      # got is then HGOT and cannot trigger a passive (see the note).
      - cql: |
          (
            [form="get|gets|getting"%c & xpos="VB.*"]
            | (
                <s> []{0,2}
                | [
                    (form!="have|has|['’]ve|had|having|['’]d"%c | xpos!="V.*")
                    & (form!="['’]s" | xpos!="VBZ")
                    & form!="hath"%c
                  ]
                  [] []
                | [xpos!="RB.*" | form=$mfte/hedges%c] []
                | [xpos!="RB.*" | form=$mfte/hedges%c]
              )
              [form="got"%c & xpos="VB.*"]
          )
          (
            [xpos="NN.*|PRP|RB.*" & form!="he"%c]{0,1}
            | [xpos="DT|NN.*" & form!="he"%c]
              [xpos="NN.*" & form!="he"%c]
          )
          @[xpos="VBD"]

      # HAVE got: remove got itself, which MFTE retags HGOT.
      # Preserve its case-sensitive pronoun list and hedge exclusions.
      - cql: |
          [
            (form="have|has|['’]ve|had|having|['’]d"%c & xpos="V.*")
            | (form="['’]s" & xpos="VBZ")
            | form="hath"%c
          ]
          [
            (
              (xpos="RB.*|NN.*" & form!="he"%c)
              | form="i|we|he|she|they"
              | (form="it" & xpos="P.*")
            )
            & form!=$mfte/hedges%c
          ]{0,2}
          @[form="got"%c & xpos="VBD"]

      # In split du n no, MFTE replaces all three supplied tags.
      # Remove a VBD candidate on the first token, du.
      - cql: |
          @[form="du"%c]
          [form="n"]
          [form="no"]

      # Remove a VBD candidate on the second token, n.
      - cql: |
          [form="du"%c]
          @[form="n"]
          [form="no"]

      # Remove a VBD candidate on the third token, no.
      - cql: |
          [form="du"%c]
          [form="n"]
          @[form="no"]

    note: |
      MFTE 1.6.0.2 counts the tokens Stanza tags VBD that keep that tag. It
      takes an -ed or -en form after BE, and an -ed form after HAVE, to be
      mistagged participles (passive and perfect), any VBD form after GET to
      be a GET-passive, and *got* after HAVE to be HAVE *got*. Its HAVE
      *got* subject list names lower-case *i*, *we*, *he*, *she*, *it* and
      *they*, as well as nouns. The pronoun forms are case-sensitive and
      omit *you*, so *got* tagged VBD still counts in *Have you got a car?*
      and *Have I got a car?*.

      With two qualifying adverbs between HAVE and *got*, MFTE changes
      *got* to its HAVE *got* tag (HGOT) before processing the following
      word. Its correction back to perfect allows only zero or one adverb,
      so *got* can no longer trigger the GET-passive rule. In *has not
      really got arrested*, *arrested* therefore still counts if tagged
      VBD. The GET-passive exclusion checks the three tokens before *got*
      to preserve this exception. Words already tagged as hedges, such as
      *probably*, do not qualify as adverbs in the HAVE *got* patterns.

      It also removes an -ed or -en form tagged VBD when it follows a passive
      participle and *and* or *or*, continuing through longer chains. The
      first participle may be tagged VBN or mistagged VBD. Immediately
      after *'s*, or with one intervening adverb, the coordination patterns
      leave out the forms MFTE reclassifies as perfects: *been*, *had*,
      *done* and its stative-verb list.

      MFTE also replaces HAVE and NEED immediately before infinitival *to*
      with its necessity-modal tag, so *had* in *had to leave* and *needed*
      in *needed to leave* do not count.

      MFTE also corrects *du n no* before these rules run, changing its
      tokens to present tense, negation and base verb. None retains a VBD
      tag, so the exclusions cover all three possible anchor positions.

      It also turns a contracted *'d* that Stanza tagged as a modal into
      VBD (HAD) before a past participle, before an adverb and a participle,
      and before *better*. This correction requires a straight apostrophe
      and does not allow an intervening negator. Its auxiliary lists accept
      either apostrophe. The words allowed between the auxiliary and the
      verb are approximated: MFTE lists particular sequences of adverbs,
      negators and (pro)nouns.

      Before checking passives, MFTE's filled-pause expression
      `\b[he]{2,}_` also matches the pronoun *he*, ignoring case, and
      replaces its tag with FPUH. Its passive checks no longer see a
      pronoun there. The exclusions reproduce this for whole-token *he*
      by disallowing it in the intervening positions after BE and GET.
      This also prevents a passive reading from spreading to coordinated
      participles. In *They were he selected and extracted*, with
      *selected* tagged VBN and *extracted* tagged VBD, both MFTE and this
      rule count *were* and *extracted* as past tense. MFTE restores *he*
      to a pronoun tag later, after those passive checks.

      HAVE patterns that recognise lower-case *he* by its spelling still
      accept it, regardless of its supplied tag. Capitalized *He* and
      *HE* lose their tags too, but do not match that case-sensitive
      spelling check. No form of *he* supplies an adverb for the modal
      *'d* correction or the first position of the two-token perfect gap;
      the source leaves that gap's second position unrestricted.
      Other earlier retagging, including the remaining filled-pause forms,
      is not fully reproduced; the intervening POS sequences also remain
      an approximation.

  - id: pybiber
    from: pybiber
    tagsets: {deprel: clearnlp}
    match:
      - cql: |
          [xpos="VBD" & deprel!="punct"]
    note: |
      pybiber 0.3.1 counts the matches of `\S*_vbd` in a document's
      lower-cased word_TAG pairs (biber_dict.py), with the tags of spaCy's
      en_core_web_sm. Before matching, it clears the POS tag of tokens
      whose dependency relation is `punct` (parse_functions.py,
      `_block_regex_features`), so their original POS tag does not
      contribute to the count.
      Auxiliaries, irrealis *were* and *had* in *had better* all count.

      This reconstruction tests the POS and dependency fields directly.
      Pybiber's regex has no boundary after the tag, so it also counts a
      non-Penn tag such as VBDX. It can find `_vbd` inside a word form such
      as `label_vbd` even when that token is tagged NN. This rule requires
      VBD in the POS field and omits both string-matching behaviours.
      Pybiber also drops tokens whose form is a single space; this rule
      counts such a token if it is supplied with VBD and a dependency
      relation other than `punct`. These differences are recorded on
      controlled inputs.
